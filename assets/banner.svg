<svg fill="none" viewBox="0 0 1200 360" width="100%" height="100%" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0d1527" />
      <stop offset="100%" stop-color="#151a30" />
    </linearGradient>

    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="badge-glow" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#3b82f6" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#8b5cf6" stop-opacity="0.2" />
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#ffffff" stroke-width="1" stroke-opacity="0.04" />
      <circle cx="40" cy="40" r="1.5" fill="#38bdf8" fill-opacity="0.2" />
    </pattern>

    <!-- Drop Shadows -->
    <filter id="glow-light" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="10" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .glow-orb-1 {
        animation: floatOrb1 14s ease-in-out infinite alternate;
      }
      .glow-orb-2 {
        animation: floatOrb2 18s ease-in-out infinite alternate;
      }
      .wave-line {
        stroke-dasharray: 8 6;
        animation: dashMove 30s linear infinite;
      }
      .pulse-pill {
        animation: pulsePill 4s ease-in-out infinite alternate;
      }
      .bracket-glow {
        animation: bracketPulse 3s ease-in-out infinite alternate;
      }
      @keyframes floatOrb1 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(60px, 30px) scale(1.15); }
      }
      @keyframes floatOrb2 {
        0% { transform: translate(0px, 0px) scale(1); }
        100% { transform: translate(-50px, -40px) scale(1.2); }
      }
      @keyframes dashMove {
        0% { stroke-dashoffset: 0; }
        100% { stroke-dashoffset: 400; }
      }
      @keyframes pulsePill {
        0% { opacity: 0.65; transform: scale(0.98); }
        100% { opacity: 0.95; transform: scale(1.02); }
      }
      @keyframes bracketPulse {
        0% { opacity: 0.3; }
        100% { opacity: 0.8; }
      }
      .title-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 800;
        font-size: 38px;
        letter-spacing: -0.5px;
      }
      .subtitle-text {
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        font-weight: 400;
        font-size: 16px;
        letter-spacing: 0.2px;
      }
      .tag-text {
        font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', Menlo, monospace;
        font-weight: 600;
        font-size: 13px;
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="100%" height="100%" fill="url(#bg-grad)" rx="16" />
  <rect width="100%" height="100%" fill="url(#grid)" rx="16" />

  <!-- Dynamic Glowing Orbs in Background -->
  <g opacity="0.6">
    <circle class="glow-orb-1" cx="150" cy="90" r="120" fill="url(#accent-cyan)" filter="url(#glow-light)" />
    <circle class="glow-orb-2" cx="1060" cy="270" r="140" fill="url(#accent-purple)" filter="url(#glow-light)" />
    <circle cx="950" cy="70" r="70" fill="#3b82f6" fill-opacity="0.1" filter="url(#glow-light)" />
  </g>

  <!-- Ambient Dynamic Circuit / Wave Lines -->
  <g fill="none" opacity="0.4">
    <path class="wave-line" d="M 0,110 C 300,50 600,160 1200,90" stroke="#38bdf8" stroke-width="1.5" />
    <path class="wave-line" d="M 0,260 C 400,320 800,210 1200,280" stroke="#a855f7" stroke-width="1.5" />
  </g>

  <!-- Decorative Syntax Brackets (Behind text) -->
  <g class="bracket-glow" fill="none" stroke="#475569" stroke-width="2.5" opacity="0.4">
    <!-- Left Mustache / Jinja Tag -->
    <path d="M 90,140 Q 60,170 90,200" />
    <path d="M 105,135 Q 75,170 105,205" />
    <!-- Right Mustache / Jinja Tag -->
    <path d="M 1110,140 Q 1140,170 1110,200" />
    <path d="M 1095,135 Q 1125,170 1095,205" />
  </g>

  <!-- Top Category Pill (Foreground) -->
  <g transform="translate(425, 38)">
    <rect width="350" height="32" rx="16" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.6" />
    <circle cx="20" cy="16" r="4.5" fill="#38bdf8" />
    <text x="35" y="21" fill="#93c5fd" class="tag-text">SERVER-SIDE &amp; CLIENT-SIDE TEMPLATING</text>
  </g>

  <!-- Main Title (Foreground) -->
  <text x="600" y="132" text-anchor="middle" class="title-text" fill="url(#primary-grad)" filter="drop-shadow(0 2px 8px rgba(0,0,0,0.8))">
    Templating Engines &amp; Languages
  </text>

  <!-- Subtitle (Foreground) -->
  <text x="600" y="172" text-anchor="middle" class="subtitle-text" fill="#cbd5e1">
    Curated SaaS Runtimes, Logic-Less Parsers, Type-Safe Compilers &amp; SSR Web Technologies
  </text>

  <!-- Interactive Dynamic Language Chips / Badges Bar (Foreground) -->
  <g transform="translate(140, 222)" class="pulse-pill">
    <!-- Jinja2 -->
    <g transform="translate(0, 0)">
      <rect width="130" height="38" rx="8" fill="#1e293b" stroke="#38bdf8" stroke-width="1" stroke-opacity="0.5" />
      <text x="65" y="24" text-anchor="middle" class="tag-text" fill="#e2e8f0">{ { Jinja2 } }</text>
    </g>

    <!-- Liquid -->
    <g transform="translate(145, 0)">
      <rect width="125" height="38" rx="8" fill="#1e293b" stroke="#06b6d4" stroke-width="1" stroke-opacity="0.5" />
      <text x="62" y="24" text-anchor="middle" class="tag-text" fill="#38bdf8">Liquid JS</text>
    </g>

    <!-- Handlebars -->
    <g transform="translate(285, 0)">
      <rect width="145" height="38" rx="8" fill="#1e293b" stroke="#f59e0b" stroke-width="1" stroke-opacity="0.5" />
      <text x="72" y="24" text-anchor="middle" class="tag-text" fill="#fbbf24">{{ Handlebars }}</text>
    </g>

    <!-- Mustache -->
    <g transform="translate(445, 0)">
      <rect width="130" height="38" rx="8" fill="#1e293b" stroke="#10b981" stroke-width="1" stroke-opacity="0.5" />
      <text x="65" y="24" text-anchor="middle" class="tag-text" fill="#34d399">Mustache</text>
    </g>

    <!-- Templ -->
    <g transform="translate(590, 0)">
      <rect width="105" height="38" rx="8" fill="#1e293b" stroke="#6366f1" stroke-width="1" stroke-opacity="0.5" />
      <text x="52" y="24" text-anchor="middle" class="tag-text" fill="#a5b4fc">Templ (Go)</text>
    </g>

    <!-- Askama -->
    <g transform="translate(710, 0)">
      <rect width="115" height="38" rx="8" fill="#1e293b" stroke="#ec4899" stroke-width="1" stroke-opacity="0.5" />
      <text x="57" y="24" text-anchor="middle" class="tag-text" fill="#f472b6">Askama (Rust)</text>
    </g>

    <!-- Pug / EJS -->
    <g transform="translate(840, 0)">
      <rect width="80" height="38" rx="8" fill="#1e293b" stroke="#8b5cf6" stroke-width="1" stroke-opacity="0.5" />
      <text x="40" y="24" text-anchor="middle" class="tag-text" fill="#c084fc">Pug / EJS</text>
    </g>
  </g>

  <!-- Bottom Metric / Eco Bar (Foreground) -->
  <g transform="translate(300, 290)">
    <rect width="600" height="36" rx="18" fill="#0f172a" stroke="#334155" stroke-width="1" />
    <text x="300" y="23" text-anchor="middle" class="subtitle-text" fill="#94a3b8" font-size="13px">
      🚀 High Performance • 🛡️ SSTI &amp; XSS Sandboxed • 🌐 Polyglot Multi-Platform
    </text>
  </g>
</svg>
